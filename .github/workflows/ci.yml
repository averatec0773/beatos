name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-push / rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # libsndfile + ffmpeg back librosa's decode path (the default analysis
      # engine; the librosa backend test loads a real WAV fixture).
      - name: Install audio system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Plain sync (no `--extra essentia`) = the permissive librosa engine the
      # distributed build ships. Keeps AGPL out of CI and tests the shipped path.
      - name: Sync workspace
        run: uv sync

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

  desktop:
    # win/mac/web parity is a load-bearing claim (CLAUDE.md rule 16) — build the
    # Electron target on all three desktop OSes so a Windows/macOS-only build or
    # native-dep (electron-builder install-app-deps, esbuild) break is caught.
    # lint/typecheck/vitest are OS-independent, so they run once on ubuntu.
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: npm run typecheck

      - name: Unit tests (vitest)
        if: matrix.os == 'ubuntu-latest'
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

  web:
    # The browser SPA is the third front end: build it and run the end-to-end
    # web smoke (sidecar in web mode + headless Chromium — no display needed).
    name: Web (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install audio system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync workspace (sidecar)
        run: uv sync

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/desktop

      - name: Build web SPA
        run: npm run build:web
        working-directory: apps/desktop

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop

      - name: Web smoke
        run: npm run smoke:web
        working-directory: apps/desktop

# Intentionally NOT gated here yet, tracked as follow-ups so this CI stays a
# meaningful green signal from day one:
#   - `npm run smoke`: the Electron smoke harness needs a virtual display (xvfb),
#     the Python sidecar env, and a packaged build. Add a `smoke` job
#     (ubuntu + xvfb-run + uv sync + npm run build + npm run smoke) once reliable.
#   - Python ruff/mypy: not configured yet (prior audit M1).
#
# Lint runs with errors-fail / warnings-allowed (eslint default — no
# --max-warnings). ~52 advisory warnings remain (explicit-return-type,
# set-state-in-effect, etc., deliberately downgraded from errors); tighten later
# if desired.
