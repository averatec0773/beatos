[project]
name = "beatos-workspace"
version = "0.0.49"
description = "BeatOS workspace root — three Python packages under uv."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "beatos-core",
    "beatos-http",
    "beatos-mcp",
]

# `uv sync --extra essentia` enables the optional Essentia analysis engine
# (AGPL — personal/dev only). Plain `uv sync` uses the permissive librosa
# fallback, which is what distributed builds ship.
[project.optional-dependencies]
essentia = ["beatos-core[essentia]"]

[tool.uv.workspace]
members = [
    "packages/beatos-core",
    "packages/beatos-http",
    "packages/beatos-mcp",
    "packages/beatos-platforms",
]

[tool.uv.sources]
beatos-core = { workspace = true }
beatos-http = { workspace = true }
beatos-mcp = { workspace = true }
beatos-platforms = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
]
# Build-only tooling for packaging the sidecar into a standalone binary
# (EPIC-D1: `uv run pyinstaller build/beatos-sidecar.spec`). Dev/build-time
# only — never a runtime dependency of the shipped wheels.
build = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
