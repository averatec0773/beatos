<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>BeatOS</title>
    <!--
      CSP for BeatOS renderer.
      connect-src allows the Python sidecar on 127.0.0.1 (any port — it's ephemeral).
      font-src includes data: because @fontsource ships some woff2 as data URLs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
