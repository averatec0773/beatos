[project]
name = "beatos-http"
version = "0.0.36"
description = "BeatOS FastAPI facade — thin HTTP surface for the Electron renderer."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "beatos-core",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatos_http"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
