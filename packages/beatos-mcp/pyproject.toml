[project]
name = "beatos-mcp"
version = "0.0.22"
description = "BeatOS MCP facade — FastMCP server (mounted by beatos-http) + stdio bridge launcher."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "beatos-core",
    "mcp>=1.27",
    "mcp-proxy>=0.6,<0.7",
    "structlog>=25.5.0",
]

[project.scripts]
beatos-mcp = "beatos_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
