[project]
name = "beatos-core"
version = "0.0.28"
description = "BeatOS business logic — no web / RPC / Electron dependencies."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "mutagen>=1.47",
    "watchdog>=5.0",
    "librosa>=0.10,<0.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatos_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
