[project]
name = "beatos-core"
version = "0.0.42"
description = "BeatOS business logic — no web / RPC / Electron dependencies."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "aiosqlite>=0.20",
    "beatos-platforms",
    "pydantic>=2.9",
    "mutagen>=1.47",
    "watchdog>=5.0",
    "librosa>=0.10,<0.11",
]

# Optional, higher-accuracy + faster analysis engine. AGPL-3.0 — install for
# personal/dev use (`uv sync --extra essentia`); EXCLUDE from distributed builds,
# which fall back to the permissive librosa engine. See NOTICE + backends/.
[project.optional-dependencies]
essentia = ["essentia>=2.1b6.dev1110"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatos_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
